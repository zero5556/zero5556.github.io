<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>Nối từ với Bot</title>

<style>
:root {
    --bg: #f0f2f5;
    --card: #ffffff;
    --primary: #2563eb;
    --bot: #dc2626;
    --text: #1f2937;
    --muted: #6b7280;
    --border: #e5e7eb;
}

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
}

.app {
    max-width: 1100px;
    margin: 20px auto;
    display: grid;
    grid-template-columns: 2fr 1fr;
    gap: 16px;
}

.card {
    background: var(--card);
    border-radius: 12px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.05);
    padding: 16px;
}

.header {
    grid-column: 1 / -1;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.header h1 {
    margin: 0;
    font-size: 22px;
}

.loader {
    display: flex;
    gap: 8px;
}

input[type="file"] {
    font-size: 14px;
}

button {
    border: none;
    border-radius: 8px;
    padding: 8px 14px;
    font-size: 14px;
    cursor: pointer;
    background: var(--primary);
    color: white;
}

button.secondary {
    background: #9ca3af;
}

.chat {
    height: 420px;
    overflow-y: auto;
    padding-right: 6px;
}

.msg {
    max-width: 75%;
    padding: 10px 12px;
    margin: 6px 0;
    border-radius: 14px;
    line-height: 1.4;
    font-size: 14px;
}

.user {
    background: #dbeafe;
    color: #1e3a8a;
    margin-left: auto;
    border-bottom-right-radius: 4px;
}

.bot {
    background: #fee2e2;
    color: #7f1d1d;
    border-bottom-left-radius: 4px;
}

.system {
    text-align: center;
    font-size: 13px;
    color: var(--muted);
}

.controls {
    display: flex;
    gap: 8px;
    margin-top: 10px;
}

.controls input {
    flex: 1;
    padding: 10px;
    border-radius: 10px;
    border: 1px solid var(--border);
    font-size: 14px;
}

.panel h3 {
    margin-top: 0;
    font-size: 16px;
}

.kv {
    font-size: 13px;
    margin: 6px 0;
}

.kv span {
    color: var(--muted);
}

.pv {
    font-size: 12px;
    background: #f9fafb;
    padding: 8px;
    border-radius: 8px;
    border: 1px dashed var(--border);
    word-break: break-word;
}
.dict-panel {
    display: flex;
    gap: 8px;
    margin-bottom: 8px;
}

.dict-panel select,
.dict-panel button {
    padding: 6px 10px;
    border-radius: 6px;
    border: 1px solid #444;
    background: #222;
    color: #fff;
}

.depth-panel {
    display: flex;
    align-items: center;
    gap: 6px;
}

.depth-panel input {
    width: 70px;
    padding: 6px;
    border-radius: 6px;
    border: 1px solid #444;
    background: #222;
    color: #fff;
}


</style>
</head>

<body>
<div class="app">

    <div class="card header">
        <h1>🧠 Nối từ với Bot</h1>
		<div class="dict-panel">
			<select id="presetDict">
			<option value="">-- Chọn từ điển sẵn có --</option>
			</select>
			<button onclick="loadPresetDict()">Dùng từ điển</button>
		</div>
        <div class="loader">
            <input type="file" id="dictFile" accept=".json,.txt">
            <button onclick="loadDictionary()">Load từ điển tự chọn</button>
            <button class="secondary" onclick="resetGame()">Reset</button>
        </div>
		<div class="depth-panel">
			<label for="depthInput">Depth:</label>
			<input id="depthInput" type="number" min="0" max="30" step="1" value="10">
		</div>

    </div>

    <div class="card">
        <div id="history" class="chat"></div>

        <div class="controls">
            <input id="inputWord" placeholder="Nhập vd: Bắt đầu">
            <button onclick="playerMove()">Gửi</button>
        </div>
    </div>

    <div class="card panel">
        <h3>Engine Info</h3>
        <div class="kv"><span>Bot move:</span> <b id="info-move">-</b></div>
        <div class="kv"><span>Score:</span> <b id="info-score">-</b></div>
        <div class="kv"><span>Depth:</span> <b id="info-depth">-</b></div>
        <div class="kv"><span>Nodes:</span> <b id="info-nodes">-</b></div>
        <div class="kv"><span>NPS:</span> <b id="info-nps">-</b></div>
        <div class="kv"><span>Time:</span> <b id="info-time">-</b>s</div>

        <h3>PV Line</h3>
        <div class="pv" id="info-pv"></div>
    </div>

</div>
